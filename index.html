
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0710">
<title>DARK CLIENT</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:radial-gradient(ellipse at top,#351044 0%,transparent 45%),#09070d;
 color:white;
 font-family:'Rajdhani',sans-serif;
}

.app{
 max-width:680px;
 margin:auto;
 padding:22px 15px 35px;
}

header{
 padding:22px 8px;
 border-bottom:1px solid #38213f;
}

.brand{
 font-family:'Orbitron',sans-serif;
 font-size:25px;
 font-weight:900;
 letter-spacing:3px;
}

.brand span{color:#d946e9}

.status{
 margin-top:10px;
 font-family:'Orbitron',sans-serif;
 font-size:10px;
 letter-spacing:3px;
 color:#bd65e9;
}

.copy{
 width:100%;
 margin:22px 0 12px;
 padding:18px;
 border:1px solid #a53ac7;
 border-radius:12px;
 background:linear-gradient(110deg,#7621a8,#d43ac7);
 color:white;
 font-family:'Orbitron',sans-serif;
 font-size:12px;
 font-weight:800;
 letter-spacing:2px;
 cursor:pointer;
}

.copy:active{transform:scale(.98)}

.tabs{
 display:flex;
 gap:9px;
 padding:7px;
 margin:22px 0;
 background:#100b16;
 border:1px solid #38213f;
 border-radius:13px;
}

.tab{
 flex:1;
 padding:15px 5px;
 border:0;
 border-radius:9px;
 background:transparent;
 color:#9c8ba5;
 font-family:'Orbitron',sans-serif;
 font-size:11px;
 font-weight:700;
 letter-spacing:1px;
 cursor:pointer;
}

.tab.active{
 background:linear-gradient(110deg,#8625c5,#d13ac7);
 color:white;
 box-shadow:0 0 18px #a52bff44;
}

.section{display:none}
.section.active{display:block}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.tile{
 min-height:150px;
 padding:19px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 background:linear-gradient(145deg,#211326,#100b16);
 border:1px solid #65316e;
 border-radius:14px;
 box-shadow:0 0 15px #a52bff12;
 transition:.2s;
}

.tile:hover{border-color:#d946e9}

.name{
 font-family:'Orbitron',sans-serif;
 font-size:12px;
 font-weight:700;
 line-height:1.8;
 letter-spacing:1px;
}

.toggleline{
 display:flex;
 align-items:center;
 gap:12px;
 color:#d78aff;
 font-family:'Orbitron',sans-serif;
 font-size:10px;
 letter-spacing:2px;
}

.switch{
 appearance:none;
 width:45px;
 height:24px;
 border-radius:20px;
 background:#39313f;
 position:relative;
 cursor:pointer;
 transition:.2s;
 flex-shrink:0;
}

.switch:before{
 content:"";
 position:absolute;
 width:16px;
 height:16px;
 left:4px;
 top:4px;
 border-radius:50%;
 background:#aaa;
 transition:.2s;
}

.switch:checked{
 background:linear-gradient(90deg,#8e20d3,#ed45cf);
}

.switch:checked:before{
 left:25px;
 background:white;
}

.settings-card{
 padding:22px;
 background:linear-gradient(145deg,#211326,#100b16);
 border:1px solid #65316e;
 border-radius:14px;
}

.download{
 display:block;
 text-align:center;
 text-decoration:none;
 margin-top:20px;
 padding:18px;
 border-radius:10px;
 background:linear-gradient(110deg,#8625c5,#d43ac7);
 color:white;
 font-family:'Orbitron',sans-serif;
 font-size:11px;
 font-weight:800;
 letter-spacing:2px;
}

.description{
 color:#a394ad;
 font-size:15px;
 margin-top:12px;
}

.footer{
 text-align:center;
 margin-top:30px;
 color:#75667e;
 font-family:'Orbitron',sans-serif;
 font-size:9px;
 letter-spacing:2px;
}

.toast{
 position:fixed;
 bottom:25px;
 left:50%;
 transform:translate(-50%,20px);
 opacity:0;
 background:#291532;
 border:1px solid #b84cff;
 padding:13px 20px;
 border-radius:10px;
 font-family:'Orbitron',sans-serif;
 font-size:10px;
 transition:.2s;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

@media(max-width:390px){
 .brand{font-size:21px}
 .grid{gap:9px}
 .tile{padding:14px}
 .name{font-size:10px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  DARK <span>CLIENT</span>

</div>
</section>

   s.classList.toggle('active',s.id===btn.dataset.tab);

});

</body>
  </html>
